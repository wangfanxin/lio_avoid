ego_planner_node:
  ros__parameters:
    # --- what the FSM plans -------------------------------------------------------------------
    "fsm/flight_type": 1                 # 1 = MANUAL_TARGET: the goal arrives on /move_base_simple/goal
    "fsm/thresh_replan_time": 1.0
    # THE LAST-METRE DEAD ZONE, and the reason a mission could not finish a leg.  With
    # "fsm/planning_horizon": 12.0 the local target IS the global target, so the FSM is always in the
    # "close to the global target" branch of EXEC_TRAJ, whose replan condition is
    #     (end_pt_ - pos).norm() > thresh_no_replan_meter  &&  t_cur > thresh_replan_time
    # -- i.e. with 1.0 m (upstream's default) ego STOPS REPLANNING as soon as it is within a metre of the
    # goal, and the rest of the leg has to be flown on the last plan it happened to hold.  MEASURED
    # 2026-10-14 (sorties R1/S1/T1, the circle): every station sits in a pillar's tight spot (stop 1 is
    # 0.85 m from a pillar surface), so the last metre is exactly where the plan gets refused; ego then sits
    # in WAIT_TARGET and only a NEW goal pulls it out -- which is why the sender's 1 Hz goal repeat turned
    # out to be load-bearing (S1: repeats suppressed -> 6 committed trajectories, aircraft stopped dead) and
    # why repeats that DID arrive were harmful in a different way (R1: 145 trajectories, none flown to
    # completion).  0.15 m keeps replanning until the vehicle is essentially at the goal.
    "fsm/thresh_no_replan_meter": 0.15
    "fsm/planning_horizon": 12.0         # > the A* route length, so getLocalTarget() returns the GOAL
    "fsm/planning_horizen_time": 3.0     # (upstream's spelling)
    "fsm/emergency_time": 1.0
    "fsm/realworld_experiment": false
    "fsm/fail_safe": true
    "fsm/waypoint_num": -1
    # --- the local map, built from /lio/cloud_world -------------------------------------------
    "grid_map/resolution": 0.10
    "grid_map/map_size_x": 14.0
    "grid_map/map_size_y": 14.0
    "grid_map/map_size_z": 5.0
    "grid_map/local_update_range_x": 6.0
    "grid_map/local_update_range_y": 6.0
    "grid_map/local_update_range_z": 3.0
    # DECIDED by the user 2026-10-14: "ego膨胀0.1m就够了我觉得".  0.10 m is exactly ONE grid cell
    # (`inf_step = ceil(0.10 / 0.10) = 1`), and it is also within a thousandth of upstream's own default
    # (`advanced_param.launch.py`: 0.099) -- ego-planner's inflation is the PLANNER's own margin, not the
    # project's safety contract.  The contract lives in the adapter's `--footprint` (now 0.20 m, measured
    # against the TRUE pillar surfaces of the world file) and it is strictly larger, so the adapter is
    # still the binding gate.
    # WAS 0.45 (5 cells = 0.50 m).  MEASURED 2026-10-14 (STATUS.md row 50, commit b46a2e4): raising it
    # 0.2 -> 0.45 "moved the withheld point from 110 to 92 but did NOT change the clearance", so this
    # number was never what decided how close the plan came.  What it DID decide is whether ego's map has
    # any free channel at all in a dense forest: a corridor of width g stays passable for ego only while
    # g > 2 x inflation (1.00 m at 0.45, 0.20 m at 0.10).  The user's 1.5 m / r = 0.4 m forest has
    # corridors of 0.565-0.640 m, so at 0.45 the whole forest was solid to the planner and at 0.10 it is
    # threadable (0.365-0.440 m of free channel = 3.6-4.4 cells).
    "grid_map/obstacles_inflation": 0.10
    "grid_map/local_map_margin": 10
    "grid_map/ground_height": 0.0
    "grid_map/use_depth_filter": false    # there is NO camera in this project
    "grid_map/p_hit": 0.65
    "grid_map/p_miss": 0.35
    "grid_map/p_min": 0.12
    "grid_map/p_max": 0.90
    "grid_map/p_occ": 0.80
    "grid_map/min_ray_length": 0.5
    "grid_map/max_ray_length": 6.0
    "grid_map/virtual_ceil_height": 4.0
    "grid_map/visualization_truncate_height": 4.0
    "grid_map/show_occ_time": false
    "grid_map/pose_type": 2               # 2 = ODOMETRY
    "grid_map/frame_id": "lio_world"
    # --- the planner ---------------------------------------------------------------------------
    "manager/max_vel": 2.0
    "manager/max_acc": 1.0
    "manager/max_jerk": 2.0
    "manager/control_points_distance": 0.4
    "manager/feasibility_tolerance": 0.05
    "manager/planning_horizon": 12.0
    "manager/use_distinctive_trajs": false
    "manager/drone_id": 0
    "optimization/lambda_smooth": 1.0
    "optimization/lambda_collision": 0.5
    "optimization/lambda_feasibility": 0.1
    "optimization/lambda_fitness": 1.0
    "optimization/dist0": 0.60
    "optimization/swarm_clearance": 0.5
    "optimization/max_vel": 2.0
    "optimization/max_acc": 1.0
    "bspline/limit_vel": 1.0
    "bspline/limit_acc": 1.0
    "bspline/limit_ratio": 1.1
    "prediction/obj_num": 0
    "prediction/lambda": 1.0
    "prediction/predict_rate": 1.0
