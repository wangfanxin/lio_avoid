ego_planner_node:
  ros__parameters:
    # ==================================================================================================
    # THE DYNAMICS ARM: every limit here is chosen from a MEASUREMENT of what THIS aircraft does, and the
    # numbers below say which keys are LIVE, which are DEAD, and who is tighter.
    #
    # WRITTEN 2026-10-15 from docs/metrics/phaseB-pipeline-audit-20261015.txt (the C++ read verbatim) and
    # from the FCU's own parameter record (tools/bin-params.py on logs/missionA-AP5-stations/flight.BIN,
    # 1328 names).  It is a SIBLING of params/ego_planner_humble_coll20.yaml -- that file is the arm AP5/AP6
    # actually flew and it is NOT modified, so every number already reported stays comparable.
    #
    # THIS FILE HAS NOT BEEN FLOWN YET.  It changes the plan's speed and acceleration, which changes the
    # dynamics under test, so it must be one labelled arm (suggested tag AP8-rect-dyn) and not a silent
    # substitution into a flight meant to test something else.
    # ==================================================================================================
    #
    # --------------------------------------------------------------------------------------------------
    # THE THREE-WAY TABLE (ego's assumption | interface | the FCU's own limit | who is tighter | factor)
    # --------------------------------------------------------------------------------------------------
    # quantity            ego assumption              interface           FCU limit (its own record)     tighter   factor
    # ------------------  --------------------------  ------------------  ----------------------------  --------  ------
    # speed               2.0 m/s  (manager/max_vel    published as the    WP_SPD 2.0 m/s                equal     1.00x
    #                     line 51 of the coll20 file)  plan's vel stream   (params/phase_a_mission_fast.parm:20,
    #                                              (exact, since           FCU record WP_SPD 2.0)
    #                                              /planner/traj_dyn)
    # acceleration        1.0 m/s^2 (manager/max_acc   acceleration is     WP_ACC 2.5 m/s^2              ego       2.5x
    #                     line 52)                     NOT SENT (setpoint  (phase_a_mission_fast.parm:23)
    #                                                  mode posvel)        LOIT_ACC_MAX_M 3.0 m/s^2      ego       3.0x
    #                                                                       a_max from ATC_ANGLE_MAX 30 deg
    #                                                                       = g*tan(30) = 5.66 m/s^2      ego       5.7x
    # jerk                -- nothing limits it --      --                  PSC_NE_JERK 5.0 m/s^3         FCU       19.4x
    #                                                                       (FCU record; the only jerk
    #                                                                       limit anywhere in the loop)
    # attitude            no plan-side limit           --                  ATC_ANGLE_MAX 30 deg          FCU       --
    #                                                                       (params/apm_lio_only.parm:144)
    # ATC_ACCEL_P_MAX     -- (does not exist in this firmware: the FCU's full 1328-name parameter list has
    # ATC_ACCEL_R_MAX     no ATC_ACCEL_* at all, so the horizontal acceleration ceiling is the ATTITUDE
    #                     limit, g*tan(ATC_ANGLE_MAX) = 5.66 m/s^2, not a separate gain)
    # --------------------------------------------------------------------------------------------------
    #
    # WHICH KEYS ARE LIVE, MEASURED BY READING THE C++: the audit's finding is that
    # `bspline/limit_vel`, `bspline/limit_acc`, `bspline/limit_ratio` and `manager/max_jerk` are NEVER READ
    # (uniform_bspline.cpp hard-codes 1.1 for the ratio at :131), and only `manager/max_vel` and
    # `manager/max_acc` take effect -- with a 5 % tolerance (2.1001 / 1.0501) -- and REFINED trajectories
    # are not re-checked (planner_manager.cpp:315-317).  They are kept in this file, at the bottom, under a
    # DEAD KEYS heading, so that nobody tunes them again expecting an effect.
    #
    # AND THE PLAN VIOLATES THE ONE LIMIT THAT IS LIVE.  MEASURED over AP5's 44 committed trajectories:
    #     |v|max  median 2.050, max 2.123 m/s   (3 of 44 above 2.0 -- the 5 % tolerance, so velocity holds)
    #     |a|max  median 1.89,  MAX 7.785 m/s^2 (32 of 44 ABOVE 1.0, i.e. 7.8x the configured max_acc and
    #                                            3.1x the FCU's WP_ACC 2.5)
    #     jerk    inter-knot max 88.24 m/s^3, |jerk| max 97.6 m/s^3  (19.4x the FCU's PSC_NE_JERK 5.0)
    # A cubic uniform B-spline is C2: the ACCELERATION is continuous and piecewise linear (measured inter-knot
    # jump 4.1e-6 m/s^2), and what jumps is the JERK.  So "the plan asks for 7.8 m/s^2 and 97 m/s^3" is not a
    # smoothness complaint -- it is the plan asking the position controller for more than the attitude loop
    # can deliver, on a corridor of 0.565-0.640 m.
    #
    # WHAT THE AIRCRAFT ACTUALLY DID (same audit, AP5 24-50 s): |v_cmd| median 0.544 / p95 1.725 m/s against
    # |v_ach| median 1.077 / p95 2.489 / max 2.984 m/s -- the ratio is 1.29, i.e. THE AIRCRAFT FLEW FASTER
    # THAN IT WAS ASKED TO, achieved |a| up to 3.87 m/s^2, the position error was median 0.074 / p95 1.220 /
    # max 2.833 m, 23 % of the samples above 0.5 m/s had a COMMANDED speed below 0.05 m/s, and the lag search
    # hit its +/-0.40 s bound while beating zero-delay by only ~20 %.  That is not a delay to compensate: the
    # aircraft is being DRAGGED by the position-error term of the FCU's own PSC, not flown by feedforward.
    # RAISING SPEED BEFORE THE PLAN'S ACCELERATION IS ENFORCED WOULD MAKE THIS WORSE -- which is why nothing
    # in this file raises anything.
    # --------------------------------------------------------------------------------------------------

    # --- the planner's own limits, ALL AT OR BELOW THE FCU'S MEASURED CAPABILITY -----------------------
    # THE ONE LIVE SPEED KEY (planner_manager.cpp:442,509 spaces the control points in time by it, and
    # ego_replan_fsm.cpp's arrival test compares the plan's clock against it).
    # 1.5 m/s, NOT 2.0: the aircraft's achieved speed is already 1.29x its command, and at 2.0 the plan's own
    # 20 ms grid cannot resolve the jerk it needs.  A 25 % reduction from the flown arm is the smallest change
    # that buys margin in a 0.565-0.640 m corridor without moving the mission's shape.
    "manager/max_vel": 1.5
    # THE OTHER LIVE KEY.  0.8 m/s^2 is BELOW the FCU's WP_ACC 2.5 by 3.1x and below the attitude ceiling
    # 5.66 by 7.1x -- and it is set from the ACHIEVED side too: AP5/AP6 tracking shows the position error
    # growing when the command accelerates harder than ~1 m/s^2 (the drag above).  The measured plan
    # overshoot (7.785 m/s^2 at max_acc 1.0) says the refiner will exceed this too; the point of lowering it
    # is that the TIME ALLOCATION gets longer, which is what the 20 ms reference can actually follow.
    "manager/max_acc": 0.8
    # control-point spacing: unchanged from the flown arm (0.4 m at 1.35 m/s of plan speed is ~0.3 s per
    # control point, which is coarse enough to keep the optimiser fast and fine enough for the corridor).
    "manager/control_points_distance": 0.4
    "manager/feasibility_tolerance": 0.05
    "manager/planning_horizon": 12.0             # > the route length, so getLocalTarget() returns the waypoint
    "manager/use_distinctive_trajs": false
    "manager/drone_id": 0

    # --- the optimiser, unchanged except that the collision weight stays as the flown arm's -----------
    "optimization/lambda_smooth": 1.0
    "optimization/lambda_collision": 2.0
    "optimization/lambda_feasibility": 0.1
    "optimization/lambda_fitness": 1.0
    "optimization/dist0": 0.60
    "optimization/swarm_clearance": 0.5
    "optimization/max_vel": 1.5                  # mirrors manager/max_vel (the optimiser's own copy)
    "optimization/max_acc": 0.8                  # mirrors manager/max_acc

    # --- the map: EXACTLY the flown arm's, because the corridor is what it is -------------------------
    # 0.10 m of inflation is the owner's decision ("ego膨胀0.1m就够了我觉得") and one grid cell; the project's
    # 0.20 m contract lives in the ADAPTER's --footprint, against the TRUE pillar surfaces, and is strictly
    # larger, so the adapter remains the binding gate.  The 1.5 m forest's corridors are 0.565-0.640 m, so a
    # corridor stays passable only while 2 x inflation < 0.565.
    "grid_map/resolution": 0.05
    "grid_map/map_size_x": 14.0
    "grid_map/map_size_y": 14.0
    "grid_map/map_size_z": 5.0
    "grid_map/local_update_range_x": 6.0
    "grid_map/local_update_range_y": 6.0
    "grid_map/local_update_range_z": 3.0
    "grid_map/obstacles_inflation": 0.10
    "grid_map/local_map_margin": 10
    "grid_map/ground_height": 0.0
    "grid_map/use_depth_filter": false
    "grid_map/p_hit": 0.65
    "grid_map/p_miss": 0.35
    "grid_map/p_min": 0.12
    "grid_map/p_max": 0.90
    "grid_map/p_occ": 0.80
    "grid_map/min_ray_length": 0.5
    "grid_map/max_ray_length": 6.0
    "grid_map/virtual_ceil_height": 4.0
    "grid_map/visualization_truncate_height": 4.0
    "grid_map/show_occ_time": false
    "grid_map/pose_type": 2
    "grid_map/frame_id": "lio_world"

    # --- the FSM, unchanged (the tour is the station list's business, not this file's) -----------------
    "fsm/flight_type": 1
    "fsm/thresh_replan_time": 1.0
    "fsm/thresh_no_replan_meter": 0.15
    "fsm/planning_horizon": 12.0
    "fsm/planning_horizen_time": 3.0
    "fsm/emergency_time": 1.0
    "fsm/realworld_experiment": false
    "fsm/fail_safe": true
    "fsm/waypoint_num": -1
    "prediction/obj_num": 0
    "prediction/lambda": 1.0
    "prediction/predict_rate": 1.0

    # ==================================================================================================
    # DEAD KEYS -- KEPT SO NOBODY TUNES THEM AGAIN.  MEASURED by reading the C++ (phaseB-pipeline-audit):
    # none of these is read anywhere.  They are listed at the flown arm's values, and lowering them here
    # would be a placebo: the refiner does not consult them, and refined trajectories are not re-checked
    # (planner_manager.cpp:315-317).
    # ==================================================================================================
    "bspline/limit_vel": 1.0          # DEAD (the 1.1 ratio is hard-coded at uniform_bspline.cpp:131)
    "bspline/limit_acc": 1.0          # DEAD
    "bspline/limit_ratio": 1.1        # DEAD
    "manager/max_jerk": 2.0           # DEAD -- and it matters: the plan's jerk reached 97.6 m/s^3 against
                                      # the FCU's PSC_NE_JERK 5.0, and NOTHING in the pipeline limits it.
