# The attitude the vehicle is parked in when the LIO initialises.  THIS is what decides the LIO world's
# yaw: the fork's kf_init removes the body's heading from its world, so L's x-axis becomes the body's
# forward axis at that instant.  Facing North (yaw 0) makes the FCU's local NED the textbook NED of this
# world -- (x, y, z)_ned = (N, E, -U) -- with no rotation anywhere in the mission path; facing East would
# make L coincide with W's axes but would rotate the FCU's "North" onto East.  The two cannot both hold,
# and the FCU link is the one that must be provable: see docs/FRAMES.md section 0.3.
spawn:
  x: 0.0
  y: 0.0
  z: 0.205
  yaw_deg: 0.0        # 0 = the body's x-axis points North (W's +y)

# Where the vehicle sits before take-off.  The origin of this world is the PAD, i.e. the pad centre at
# ground level; the vehicle's own origin starts 0.205 m above it, which is the one constant between
# the LIO's zero and this world's zero (see FRAMES.md 0.3, item 1).
pad:
  x: 0.0
  y: 0.0
  radius: 0.35
  height: 0.205

arena:
  floor_z: 0.0
  ceiling_z: 4.5
  walls:
    x: [-12.0, 12.0]
    y: [-12.0, 12.0]

sensor:
  frame: mid360_link
  mount: {x: 0.05, y: 0.0, z: 0.10, roll: 0.0, pitch: 45.0, yaw: 0.0}
  pattern_file: mid360_pattern.csv
  scan_rate_hz: 10.0
  points_per_scan: 20000
  range_min: 0.10
  range_max: 40.0
  range_noise_sigma: 0.02
  range_resolution: 0.0
  blind_zone: 0.10

imu:
  rate_hz: 200.0
  gyro_noise_sigma: 2.0e-4
  accel_noise_sigma: 2.0e-2
  gyro_bias: [0.0, 0.0, 0.0]
  accel_bias: [0.0, 0.0, 0.0]
  gravity_norm: 9.7946

# MISSION A IS FROZEN ELSEWHERE (frozen/mission_a.manifest) AND IS NOT FLOWN IN THIS WORLD.  There is no
# clear rectangle and no square here, so `mission.corners` is EMPTY ON PURPOSE: the reference for a flight
# in this world is `mission_b.circle` below, and PLAN.md 3 scores it with C1 (arrival) and C2 (true
# clearance), not with the corner metrics A2/B2/B3.
mission:
  takeoff_alt: 2.0
  hold_s: 3.0
  corners: []

mission_b:
  takeoff_alt: 2.0
  goal: [4.0, 0.0]      # the circle's first point, for the tools that take one goal
  circle:
    centre: [0.0, 0.0]          # the PAD is the centre: the circle is about the take-off point
    radius: 4.0
    altitude: 2.0
    points: 24
    start_deg: 0.0              # first point due East of the pad
    direction: ccw

fake_truth:
  rate_hz: 400.0
  speed: 0.20
  climb_s: 8.0
