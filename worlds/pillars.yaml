# GENERATED by sim/make_world.py --seed 7 --cells 10 --cell 1.0 --radius 0.3
# --min-gap 0.8 --clear-rect 0,3,0,2 --pad-clearance 0.8
# Do not hand-edit the pillar list; re-run the generator so the world stays reproducible.
#
# Frame: local ENU-like, x = East, y = North, z = Up, origin at the take-off point (the pad).
# Grid: 10x10 cells of 1.0 m with integer boundaries, i.e. cell centres at +-0.5, +-1.5, ...
# One pillar of radius 0.3 m per cell, randomly placed inside it, never closer than 0.8 m
# (surface to surface) to another pillar, and never inside the reserved regions below.
#
# Reserved:
#   clear rectangle  x in [0.0, 3.0], y in [0.0, 2.0]   (6 cells, mission A)
#   pad clearance    0.8 m radius around the origin
#
# Audit (computed by the generator):
#   46 pillars of radius 0.30 m in a 10 x 10 m arena (54 cells, 54 empty)
#   corridor: min surface gap requested 0.80 m
#   measured pillar-to-pillar surface gap: min 0.814 m, median 0.814 m
#   measured clearance from the origin to the nearest pillar surface: 1.281 m (requested 0.80)
#   clear rectangle x[0, 3] y[0, 2] (6 cells): EMPTY of cylinders
#   square flown: x[0.5, 2.5] y[0.4, 1.6] (centred in the clear rectangle)
#   worst pillar-surface clearance to the square: 0.600 m  (the vehicle's half footprint is ~0.35 m)
#   cells dropped: 6 for the clear rectangle, 3 for pad clearance, 45 by the gap rule
