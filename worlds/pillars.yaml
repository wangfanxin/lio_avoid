# The pillar-forest world, in one file.  Nothing here needs Gazebo: the lidar is computed by
# analytic ray casting against these primitives (see sim/raycast.py).
#
# Units: metres.  Frame: local ENU-like, x = East, y = North, z = Up, origin at the take-off point.
# The vehicle starts level on the pad; the sensor keeps the REAL drone's 45 deg nose-down mount, so
# the lidar's -7..+52 deg elevation fan (about its own axis) becomes +7..-52 deg about the body:
# it sees the floor, the pillars and the ceiling, which is what makes the vertical channel
# observable at all.

arena:
  floor_z: 0.0            # infinite plane, upward normal
  ceiling_z: 4.5          # keep a ceiling: with a lidar-only estimator the ceiling and the floor are
                          # what constrain height and pitch/roll
  walls:                  # axis-aligned box; null disables
    x: [-6.0, 6.0]
    y: [-6.0, 6.0]

pad:
  x: 0.0
  y: 0.0
  radius: 0.35
  height: 0.205

# Every pillar is a vertical cylinder: centre (x, y), radius, base and top height.
# Route A (the square) stays in the clear part of the forest; B (ego-planner) is what has to thread
# between them.
pillars:
  - {x:  2.0, y: -1.6, r: 0.18, z0: 0.0, z1: 4.0}
  - {x:  2.0, y:  3.0, r: 0.18, z0: 0.0, z1: 4.0}
  - {x:  4.2, y:  0.8, r: 0.22, z0: 0.0, z1: 4.2}
  - {x: -2.2, y:  1.2, r: 0.20, z0: 0.0, z1: 4.0}
  - {x: -3.5, y: -2.6, r: 0.25, z0: 0.0, z1: 4.2}
  - {x:  0.6, y:  2.4, r: 0.15, z0: 0.0, z1: 3.5}
  - {x:  3.4, y:  4.0, r: 0.20, z0: 0.0, z1: 4.2}
  - {x: -1.0, y:  4.4, r: 0.18, z0: 0.0, z1: 4.0}
  - {x:  5.0, y: -3.2, r: 0.30, z0: 0.0, z1: 4.5}
  - {x:  1.1, y: -1.1, r: 0.16, z0: 0.0, z1: 3.8}

# What the simulated MID-360 does.  Values from the real sensor, so the LIO sees on the desk what it
# will see on the drone.
sensor:
  frame: mid360_link
  mount: {x: 0.05, y: 0.0, z: 0.10, roll: 0.0, pitch: 45.0, yaw: 0.0}   # deg; the real mount
  pattern_file: mid360_pattern.csv        # azimuth_deg, elevation_deg per ray; a synthesised
                                          # rosette is used when the file is absent
  scan_rate_hz: 10.0
  points_per_scan: 20000                  # real MID-360: 200 000 points/s
  range_min: 0.10
  range_max: 40.0
  range_noise_sigma: 0.02                 # m, gaussian, per point
  range_resolution: 0.0                   # 0 disables quantisation
  blind_zone: 0.10

imu:
  rate_hz: 200.0
  gyro_noise_sigma: 2.0e-4                # rad/s
  accel_noise_sigma: 2.0e-2               # m/s^2
  gyro_bias: [0.0, 0.0, 0.0]
  accel_bias: [0.0, 0.0, 0.0]
  gravity_norm: 9.7946                    # what the LIO is configured with

mission:
  takeoff_alt: 2.5
  hold_s: 3.0
  corners:
    - [0.0, 0.0, 2.0]
    - [2.0, 0.0, 2.0]
    - [2.0, 1.2, 2.0]
    - [0.0, 1.2, 2.0]
    - [0.0, 0.0, 2.0]

fake_truth:
  rate_hz: 400.0
  speed: 0.20                             # m/s along each leg
  climb_s: 8.0
