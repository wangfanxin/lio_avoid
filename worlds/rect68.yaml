mission:
  takeoff_alt: 2.0
  hold_s: 5.0
  corners:
  # THE APPROACH POINT (round 22).  The pad is at (0,0) and the first corner is (-3,-4); the straight line between them
  # passes 0.300 m from the (-1.5,-1.5) pillar's axis -- exactly its radius -- and the field's square lattice makes EVERY
  # pad-to-corner direction tangent to a pillar the same way.  So the first leg is a grid-aligned dog-leg through
  # (0,-4), which lies ON the rectangle's south edge: the two laps are unchanged, and every leg of the flight becomes one
  # of the field's +0.200 m lines.  MEASURED (Flights CD, CD2, CG, CG2): with the diagonal in place the whole-flight
  # minimum sits on it in run after run (-0.030, -0.041, -0.025, -0.017 m) even when every other instant is clear.
  - &id000
    - 0.0
    - -4.0
    - 2.0
  - &id001
    - -3.0
    - -4.0
    - 2.0
  - &id002
    - 3.0
    - -4.0
    - 2.0
  - &id003
    - 3.0
    - 4.0
    - 2.0
  - &id004
    - -3.0
    - 4.0
    - 2.0
  - *id001
  - *id002
  - *id003
  - *id004
  name: rect68
  square:
  - -3.0
  - -4.0
  - 2.0
  - 6.0
  note: 'MISSION B, 2026-10-16 (owner''s instruction): a 6 x 8 m rectangle flown TWICE,
    in the SAME 46-pillar field as the diagonal.  The corners are at (+-3, +-4): each
    leg runs midway between two pillar rows, 0.5 m from their centres and therefore
    +0.20 m from their surfaces -- the widest an axis-aligned rectangle can be here.  Two
    laps = the four corners listed twice (the shell completes after the last).'
mission_b:
  takeoff_alt: 2.0
  goal:
  - 3.0
  - 4.0
fake_truth:
  rate_hz: 400.0
  speed: 0.2
  climb_s: 8.0
meta:
  note: 'A CROSSING mission for the obstacle-avoidance test.  Pillars and arena are
    IDENTICAL to worlds/pillars.yaml (46 pillars, +-5 m); only the waypoints differ,
    and they were CHOSEN so that every waypoint is clear of every pillar and every
    straight leg passes through one.  MEASURED offline: leg 1 clearance -0.300 m,
    leg 2 -0.300 m, waypoint clearances 0.407 and 0.407 m.  The C2 bound is a 0.20
    m footprint, so a planner with no obstacle awareness must be caught by it.'
